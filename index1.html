<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surprise...!</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Will you come on a date with me?(Conve)</h1>

        <div class="buttons">
            <button id="no-btn">No</button>
            <button id="yes-btn">Yes</button>
        </div>

        <div class="popup" id="popup">
            <p>Aww, thank you!</p>
        </div>

        <!-- Food popup -->
        <div id="food-popup" class="popup-choice hidden">
            <h2>🍽️ Choose a Food to eat:</h2>
            <div class="options">
                <button id="pizza-btn" class="card">
                    <img src="burger.jpg" alt="Pizza" />
                    <span>Burger</span>
                </button>
                <button id="sushi-btn" class="card">
                    <img src="chick.jpg" alt="Sushi" />
                    <span>Chicken</span>
                </button>
                <button id="burger-btn" class="card">
                    <img src="lechon.jpg" alt="Burger" />
                    <span>Lechon</span>
                </button>
                <button id="salad-btn" class="card">
                    <img src="kahit.jpg" alt="Salad" />
                    <span>Kahit ano!</span>
                </button>
            </div>
            <div id="chosen-food" class="choice-output"></div>
        </div>

        <!-- Drink popup -->
        <div id="drink-popup" class="popup-choice hidden">
            <h2>🥤 Choose a drink:</h2>
            <div class="options">
                <button id="coffee-btn" class="card">
                    <img src="milktea.jpg" alt="Coffee" />
                    <span>Milktea</span>
                </button>
                <button id="juice-btn" class="card">
                    <img src="juice.jpg" alt="Juice" />
                    <span>Juice</span>
                </button>
                <button id="tea-btn" class="card">
                    <img src="coke.jpg" alt="Tea" />
                    <span>Coke</span>
                </button>
                <button id="soda-btn" class="card">
                    <img src="water.jpg" alt="Soda" />
                    <span>Tubig na lang</span>
                </button>
            </div>
            <div id="chosen-drink" class="choice-output"></div>
        </div>

        <!-- Overlay behind popup -->
        <div id="overlay"></div>

        <!-- Summary -->
        <div id="summary" class="summary hidden">
            <h2>📝 Your Choices:</h2>
            <p id="food-choice"></p>
            <p id="drink-choice"></p>
        </div>

        <!-- Angry emoji on No hover -->
        <div id="angry-text" class="angry-text">😡</div>



    </div>

    <script src="script.js"></script>
</body>
</html>

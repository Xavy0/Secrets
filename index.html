<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>For You, Mom 🎓</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gold:#D4A843; --gold-light:#F5D98A; --cream:#FDF6E3; --deep:#1A0A00; }

  html, body {
    width:100%; height:100%; height:100dvh;
    overflow:hidden; background:#000;
    font-family:'Lato',sans-serif; touch-action:manipulation;
  }

  /* PETALS */
  #petals-canvas { position:fixed; inset:0; pointer-events:none; z-index:1; }

  /* ══ TAP GATE — the "dress code violation" screen ══ */
  #gate {
    position:fixed; inset:0; z-index:20;
    background:#f8f5f0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    transition:opacity 0.6s ease, visibility 0.6s ease;
    padding:24px;
  }
  #gate.hidden { opacity:0; visibility:hidden; pointer-events:none; }

  .notice-card {
    background:#fff;
    border:2px solid #b00;
    border-radius:10px;
    padding:clamp(18px,5vw,32px) clamp(20px,6vw,40px);
    max-width:360px; width:100%;
    text-align:center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    position:relative;
  }
  .notice-card::before {
    content:'⚠️';
    font-size:clamp(28px,8vw,44px);
    display:block; margin-bottom:10px;
  }
  .notice-label {
    font-size:clamp(9px,2.5vw,11px);
    letter-spacing:0.2em; text-transform:uppercase;
    color:#b00; font-weight:700; margin-bottom:8px;
  }
  .notice-title {
    font-family:'Playfair Display',serif;
    font-size:clamp(18px,5.5vw,26px);
    color:#1a1a1a; font-weight:700; line-height:1.2;
    margin-bottom:12px;
  }
  .notice-body {
    font-size:clamp(11px,3.2vw,14px);
    color:#444; line-height:1.6; margin-bottom:16px;
  }
  .notice-body strong { color:#b00; }
  .notice-ref {
    font-size:clamp(9px,2.5vw,11px);
    color:#999; letter-spacing:0.1em;
    border-top:1px solid #eee; padding-top:10px; margin-top:4px;
  }

  .tap-to-view {
    margin-top:20px;
    font-size:clamp(10px,2.8vw,13px);
    letter-spacing:0.2em; text-transform:uppercase;
    color:#888; animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* school seal watermark */
  .seal {
    position:absolute; top:10px; right:14px;
    font-size:clamp(22px,7vw,34px); opacity:0.07;
  }

  /* ══ MAIN VIDEO SCREEN ══ */
  #main {
    position:fixed; inset:0; z-index:5;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity 0.8s ease 0.2s, visibility 0.8s ease 0.2s;
  }
  #main.visible { opacity:1; visibility:visible; }

  /* Video fills entire screen — landscape & portrait */
  #myVideo {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;   /* keep aspect ratio, no crop */
    background:#000;
    display:block;
  }

  /* Subtle gold vignette overlay */
  #main::after {
    content:'';
    position:absolute; inset:0;
    pointer-events:none; z-index:3;
    box-shadow:inset 0 0 60px rgba(0,0,0,0.55);
  }

  /* Petals float OVER the video */
  #petals-canvas { z-index:4; }

  /* ── small floating message that fades in after 3s ── */
  #love-msg {
    position:absolute; bottom:clamp(14px,4vw,28px); left:50%;
    transform:translateX(-50%);
    z-index:5; text-align:center;
    opacity:0; animation:fadeUp 1s ease forwards 3.5s;
    pointer-events:none; white-space:nowrap;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  #love-msg p {
    font-family:'Playfair Display',serif; font-style:italic;
    color:var(--gold-light); font-size:clamp(13px,3.8vw,20px);
    text-shadow:0 2px 12px rgba(0,0,0,0.8), 0 0 20px rgba(212,168,67,0.4);
    letter-spacing:0.05em;
  }
  #love-msg .sub {
    font-family:'Lato',sans-serif; font-style:normal; font-weight:300;
    font-size:clamp(10px,2.5vw,14px);
    color:rgba(245,217,138,0.65); letter-spacing:0.15em;
    display:block; margin-top:4px;
  }

  /* ── hearts row ── */
  #hearts {
    position:absolute; bottom:clamp(58px,12vw,90px); left:50%;
    transform:translateX(-50%);
    z-index:5; display:flex; gap:8px;
    opacity:0; animation:fadeUp 1s ease forwards 4.2s;
    pointer-events:none;
  }
  #hearts span { font-size:clamp(16px,4.5vw,24px); animation:hb 1.4s ease-in-out infinite; }
  #hearts span:nth-child(2){animation-delay:0.2s}
  #hearts span:nth-child(3){animation-delay:0.4s}
  @keyframes hb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

  #bg-music { display:none; }
</style>
</head>
<body>

<!-- Music -->
<audio id="bg-music" loop>
  <!-- 🎵 Replace with your music file -->
  <source src="your-music.mp3" type="audio/mpeg">
</audio>

<!-- Petals canvas (shared, floats over video) -->
<canvas id="petals-canvas"></canvas>

<!-- ══ DRESS CODE VIOLATION GATE ══ -->
<div id="gate" onclick="startExperience()">
  <div class="notice-card">
    <div class="seal">🎓</div>
    <div class="notice-label">Official Notice</div>
    <div class="notice-title">Dress Code Violation</div>
    <div class="notice-body">
      A dress code violation has been recorded for the upcoming graduation ceremony.<br><br>
      <strong>Student is required to review the attached notice</strong> and acknowledge receipt before the event.
    </div>
    <div class="notice-ref">
      REF NO: GRAD-2026-DC-001 &nbsp;|&nbsp; CONFIDENTIAL
    </div>
  </div>
  <p class="tap-to-view">▶ &nbsp; Tap to view notice &nbsp; ▲</p>
</div>

<!-- ══ MAIN VIDEO SCREEN ══ -->
<div id="main">
  <video id="myVideo" playsinline webkit-playsinline preload="auto" controls>
    <!-- 🎬 Replace with your video file -->
    <source src="irahvid.mp4" type="video/mp4">
  </video>
</div>

<script>
/* ── PETALS ── */
const canvas=document.getElementById('petals-canvas'),ctx=canvas.getContext('2d');
let petals=[];
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
window.addEventListener('resize',resize); resize();
function mkP(){ return {x:Math.random()*canvas.width,y:-20,r:Math.random()*6+3,vx:(Math.random()-0.5)*0.7,vy:Math.random()*0.8+0.35,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.04,alpha:Math.random()*0.45+0.15,color:Math.random()>.5?'#D4A843':'#F9C8D4'}; }
for(let i=0;i<25;i++){let p=mkP();p.y=Math.random()*canvas.height;petals.push(p);}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  petals.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;
    if(p.y>canvas.height+20)Object.assign(p,mkP());
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.alpha;
    ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();ctx.restore();
  });
  requestAnimationFrame(loop);
}
loop();
setInterval(()=>{if(petals.length<55)petals.push(mkP());},700);

/* ── START (called on tap — guarantees sound) ── */
function startExperience(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('main').classList.add('visible');

  const vid=document.getElementById('myVideo');
  const music=document.getElementById('bg-music');

  // User gesture = sound allowed
  vid.muted=false;
  const vp=vid.play();
  if(vp){
    vp.catch(()=>{
      vid.muted=true;
      vid.play().catch(()=>{});
    });
  }

  music.volume=0.35;
  music.play().catch(()=>{});

  // Try fullscreen (landscape)
  const el=document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();

  // Lock to landscape if supported
  if(screen.orientation && screen.orientation.lock){
    screen.orientation.lock('landscape').catch(()=>{});
  }
}
</script>
</body>
</html>
